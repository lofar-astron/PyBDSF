name: Build and test PyBDSF

on:
  pull_request:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Build and install PyBDSF
      run: |
        python -m pip install .

    - name: Test PyBDSF
      run: |
        cd test && python tmgfunction.py && python tmulti_proc.py && python tbdsf_process_image.py
