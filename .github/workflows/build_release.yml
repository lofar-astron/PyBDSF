name: Build and upload to PyPI

# Only build and upload when a new release tag is created
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.?[a-z]+[0-9]+"
# Alternatively, build on every branch push, tag push, and pull request change
# on: [push, pull_request]

jobs:
  build:
    name: Build and test wheel and source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # needed for versioning with `setuptools-scm`

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: pipx run build

      - name: Test wheel
        run: |
          python -m pip install dist/*.whl
          cd test && python tgausfit_shape.py && python tmgfunction.py && python tmulti_proc.py && python tnatgrid.py && python ttessellate.py && python tbdsf_process_image.py --rtol 0.03

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  upload_pypi:
    name: Publish on PyPI
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    # Upload to PyPI on every tag starting with 'v'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Alternatively, to publish when a GitHub Release is created, use the following rule:
    # if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist  # put artifacts where next action expects them to be
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          # To test:
          # repository-url: https://test.pypi.org/legacy/
